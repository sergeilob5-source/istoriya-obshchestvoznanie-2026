const ITER = 200000;

const te = new TextEncoder();
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = b => Array.from(b).map(x => x.toString(16).padStart(2, "0")).join("");
const unhex = s => Uint8Array.from(s.match(/../g).map(h => parseInt(h, 16)));

async function hmacRaw(keyBytes, dataBytes) {
  const k = await crypto.subtle.importKey("raw", keyBytes,
    { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  return new Uint8Array(await crypto.subtle.sign("HMAC", k, dataBytes));
}

async function keystream(key, nonce, length) {
  const out = new Uint8Array(Math.ceil(length / 32) * 32);
  const block = new Uint8Array(nonce.length + 4);
  block.set(nonce);
  for (let i = 0; i * 32 < length; i++) {
    block[nonce.length] = i & 255;
    block[nonce.length + 1] = (i >> 8) & 255;
    block[nonce.length + 2] = (i >> 16) & 255;
    block[nonce.length + 3] = (i >> 24) & 255;
    out.set(await hmacRaw(key, block), i * 32);
  }
  return out.subarray(0, length);
}

function eq(a, b) {
  if (a.length !== b.length) return false;
  let d = 0;
  for (let i = 0; i < a.length; i++) d |= a[i] ^ b[i];
  return d === 0;
}

async function unseal(masterBytes, box) {
  const encKey = await hmacRaw(masterBytes, te.encode("enc"));
  const macKey = await hmacRaw(masterBytes, te.encode("mac"));
  const nonce = b64d(box.n), ct = b64d(box.ct), tag = b64d(box.tag);
  const macInput = new Uint8Array(nonce.length + ct.length);
  macInput.set(nonce); macInput.set(ct, nonce.length);
  if (!eq(await hmacRaw(macKey, macInput), tag)) return null;
  const ks = await keystream(encKey, nonce, ct.length);
  const pt = new Uint8Array(ct.length);
  for (let i = 0; i < ct.length; i++) pt[i] = ct[i] ^ ks[i];
  return pt;
}

async function deriveWrapKey(password, saltHex) {
  const km = await crypto.subtle.importKey("raw", te.encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: unhex(saltHex), iterations: ITER, hash: "SHA-256" }, km, 256);
  return new Uint8Array(bits);
}

function showPage(masterBytes, login) {
  unseal(masterBytes, PAYLOAD).then(pt => {
    if (!pt) { sessionStorage.removeItem("mk"); return; }
    let html = new TextDecoder().decode(pt);
    const logout = '<a href="#" onclick="sessionStorage.removeItem(\'mk\');sessionStorage.removeItem(\'mklogin\');location.reload();return false">Выйти (' + login + ')</a></nav>';
    html = html.replace("</nav>", logout);
    const doc = new DOMParser().parseFromString(html, "text/html");
    document.replaceChild(document.adoptNode(doc.documentElement), document.documentElement);
  });
}

function whenReady(fn) {
  if (document.readyState !== "loading") fn();
  else document.addEventListener("DOMContentLoaded", fn);
}

whenReady(() => {
  const saved = sessionStorage.getItem("mk");
  if (saved) showPage(unhex(saved), sessionStorage.getItem("mklogin") || "");
});

document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("btn");
  btn.disabled = true; btn.textContent = "Проверка…";
  try {
    const login = document.getElementById("l").value.trim();
    const password = document.getElementById("p").value;
    const u = USERS[login];
    if (u) {
      const wrapKey = await deriveWrapKey(password, u.salt);
      const master = await unseal(wrapKey, u);
      if (master) {
        sessionStorage.setItem("mk", hex(master));
        sessionStorage.setItem("mklogin", login);
        showPage(master, login);
        return;
      }
    }
    document.getElementById("err").style.display = "block";
  } finally {
    btn.disabled = false; btn.textContent = "Войти";
  }
});
</script>
